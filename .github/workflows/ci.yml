name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 애플리케이션 검증
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: AWS SAM CLI 설정
        uses: aws-actions/setup-sam@v2

      - name: 백엔드 의존성 설치
        run: python -m pip install -r backend/requirements-dev.txt

      - name: 프론트엔드 의존성 설치
        run: npm --prefix frontend ci

      - name: 백엔드 테스트
        run: python -m pytest backend/tests

      - name: 프론트엔드 테스트
        run: npm --prefix frontend run test

      - name: TypeScript 검사
        run: npm --prefix frontend run typecheck

      - name: 프론트엔드 프로덕션 빌드
        run: npm --prefix frontend run build

      - name: 배포 자동화 테스트
        run: python -m pytest tests/deployment

      - name: SAM 템플릿 검증
        run: sam validate --template-file template.yaml --region ap-northeast-2

      - name: SAM 애플리케이션 빌드
        run: sam build --template-file template.yaml
