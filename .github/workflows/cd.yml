name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: my-own-fridge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 애플리케이션 배포
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SAM_STACK_NAME: ${{ vars.SAM_STACK_NAME }}
      SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 배포 대상과 변수 검사
        shell: bash
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail

          [[ "${CURRENT_REPOSITORY}" == 'haramsong/kirothon-team-015' ]] || {
            printf '승인되지 않은 GitHub 저장소입니다: %s\n' "${CURRENT_REPOSITORY}" >&2
            exit 1
          }
          [[ "${CURRENT_REF}" == 'refs/heads/main' ]] || {
            printf '승인되지 않은 Git ref입니다: %s\n' "${CURRENT_REF}" >&2
            exit 1
          }

          for variable_name in AWS_ROLE_ARN AWS_REGION SAM_STACK_NAME SAM_ARTIFACT_BUCKET; do
            [[ -n "${!variable_name:-}" ]] || {
              printf '필수 GitHub repository variable이 비어 있습니다: %s\n' "${variable_name}" >&2
              exit 1
            }
          done

          [[ "${AWS_ROLE_ARN}" == 'arn:aws:iam::462747820533:role/my-own-fridge-github-deploy' ]] || {
            printf '승인되지 않은 AWS role ARN입니다.\n' >&2
            exit 1
          }
          [[ "${AWS_REGION}" == 'ap-northeast-2' ]] || {
            printf '승인되지 않은 AWS 리전입니다: %s\n' "${AWS_REGION}" >&2
            exit 1
          }
          [[ "${SAM_STACK_NAME}" == 'my-own-fridge' ]] || {
            printf '승인되지 않은 Application Stack입니다: %s\n' "${SAM_STACK_NAME}" >&2
            exit 1
          }
          [[ "${SAM_ARTIFACT_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            printf 'SAM artifact bucket 이름 형식이 올바르지 않습니다.\n' >&2
            exit 1
          }

      - name: AWS OIDC 배포 역할 수임
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: my-own-fridge-github-deploy

      - name: AWS 계정과 리전 검사
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_account="$(aws sts get-caller-identity --query Account --output text --region "${AWS_REGION}")"
          [[ "${actual_account}" == '462747820533' ]] || {
            printf '승인되지 않은 AWS 계정입니다: %s\n' "${actual_account}" >&2
            exit 1
          }
          [[ "${AWS_REGION}" == 'ap-northeast-2' && "${AWS_DEFAULT_REGION:-}" == 'ap-northeast-2' ]] || {
            printf 'OIDC 세션의 AWS 리전이 승인된 값과 다릅니다.\n' >&2
            exit 1
          }

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: AWS SAM CLI 설정
        uses: aws-actions/setup-sam@v2

      - name: 백엔드 의존성 설치
        run: python -m pip install -r backend/requirements-dev.txt

      - name: 프론트엔드 의존성 설치
        run: npm --prefix frontend ci

      - name: 백엔드 테스트
        run: python -m pytest backend/tests

      - name: 프론트엔드 테스트
        run: npm --prefix frontend run test

      - name: TypeScript 검사
        run: npm --prefix frontend run typecheck

      - name: 프론트엔드 검증 빌드
        run: npm --prefix frontend run build

      - name: 배포 자동화 테스트
        run: python -m pytest tests/deployment

      - name: SAM 템플릿 검증
        run: sam validate --template-file template.yaml --region "${AWS_REGION}"

      - name: SAM 애플리케이션 빌드
        run: sam build --template-file template.yaml

      - name: Application Stack 배포
        run: |
          set -Eeuo pipefail
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${SAM_STACK_NAME}" \
            --s3-bucket "${SAM_ARTIFACT_BUCKET}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

      - name: Application Stack output 검사
        id: application-outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          stack_outputs="$(aws cloudformation describe-stacks \
            --stack-name "${SAM_STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output json \
            --region "${AWS_REGION}")"

          api_url="$(jq -er '.[] | select(.OutputKey == "ApiUrl") | .OutputValue' <<< "${stack_outputs}")"
          static_bucket="$(jq -er '.[] | select(.OutputKey == "StaticBucketName") | .OutputValue' <<< "${stack_outputs}")"
          distribution_id="$(jq -er '.[] | select(.OutputKey == "DistributionId") | .OutputValue' <<< "${stack_outputs}")"

          [[ "${api_url}" =~ ^https://[^[:space:]]+$ ]] || {
            printf 'ApiUrl output 형식이 올바르지 않습니다.\n' >&2
            exit 1
          }
          [[ "${static_bucket}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            printf 'StaticBucketName output 형식이 올바르지 않습니다.\n' >&2
            exit 1
          }
          [[ "${distribution_id}" =~ ^[A-Z0-9]{8,32}$ ]] || {
            printf 'DistributionId output 형식이 올바르지 않습니다.\n' >&2
            exit 1
          }

          printf 'api_url=%s\n' "${api_url%/}" >> "${GITHUB_OUTPUT}"
          printf 'static_bucket=%s\n' "${static_bucket}" >> "${GITHUB_OUTPUT}"
          printf 'distribution_id=%s\n' "${distribution_id}" >> "${GITHUB_OUTPUT}"

      - name: API URL을 주입한 프론트엔드 빌드
        env:
          VITE_API_BASE_URL: ${{ steps.application-outputs.outputs.api_url }}
        run: npm --prefix frontend run build

      - name: 프론트엔드 S3 동기화
        run: |
          aws s3 sync \
            frontend/dist \
            "s3://${{ steps.application-outputs.outputs.static_bucket }}" \
            --region "${AWS_REGION}"

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.application-outputs.outputs.distribution_id }}" \
            --paths '/*' \
            --region "${AWS_REGION}"
